name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test gateway/OpsGateway.Tests

  docker:
    runs-on: ubuntu-latest
    needs: [python, dotnet]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: smoke test both containers
        run: |
          mkdir -p data
          docker compose up -d
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs; exit 1
